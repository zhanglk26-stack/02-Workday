<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>2026 工作日看板</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="style.css?v=3" />
  </head>
  <body>
    <div class="app-container">

      <!-- Top Header / Bar -->
      <header class="app-header">
        <div class="header-left">
          <div class="brand-badge">
            <i class="ph-fill ph-calendar-check"></i>
            <span class="brand-title">工作日看板</span>
            <span class="brand-year">2026</span>
          </div>
        </div>

        <div class="header-center">
          <!-- View Switcher Tabs -->
          <div class="view-tabs">
            <button class="tab-btn active" id="tab-single" onclick="setViewMode('single')">
              <i class="ph ph-calendar-blank"></i>
              <span>单月</span>
            </button>
            <button class="tab-btn" id="tab-dual" onclick="setViewMode('dual')">
              <i class="ph ph-squares-four"></i>
              <span>双月连看</span>
            </button>
            <button class="tab-btn" id="tab-year" onclick="setViewMode('year')">
              <i class="ph ph-grid-nine"></i>
              <span>全年图谱</span>
            </button>
          </div>
        </div>

        <div class="header-right">
          <button class="btn-today" onclick="goToday()" title="回到今天">
            <i class="ph ph-target"></i>
            <span>回到今天</span>
          </button>
          <button class="btn-icon" onclick="toggleTheme()" id="theme-btn" title="切换主题">
            <i id="theme-icon" class="ph ph-sun"></i>
          </button>
        </div>
      </header>

      <!-- Sub Bar: Navigation Control (Month Nav) -->
      <div class="nav-control-bar" id="nav-control-bar">
        <div class="month-nav-group">
          <button class="btn-circle" onclick="changeMonth(-1)" title="上个月">
            <i class="ph ph-caret-left"></i>
          </button>
          <div class="current-month-display" id="month-display-text">2026年 1月</div>
          <button class="btn-circle" onclick="changeMonth(1)" title="下个月">
            <i class="ph ph-caret-right"></i>
          </button>
        </div>
        <div class="quick-month-selector" id="quick-month-selector">
          <!-- JS will populate 12 month buttons -->
        </div>
      </div>

      <!-- Main Bento Grid Content -->
      <main class="bento-container" id="bento-container">

        <!-- Left / Primary Area: Main Calendar Card -->
        <section class="bento-card bento-cal-card" id="bento-cal-card">
          <div class="cal-wrapper" id="cal-wrapper">
            <!-- Dynamically populated 1 or 2 calendar grids -->
          </div>
        </section>

        <!-- Right / Secondary Area: Stats & Detail Sidebar Bento Cards -->
        <aside class="bento-sidebar">

          <!-- Selected Date Detail Card -->
          <div class="bento-card date-detail-card" id="date-detail-card">
            <div class="detail-header">
              <span class="detail-tag" id="detail-tag">今日详情</span>
              <span class="detail-work-badge" id="detail-work-badge">工作日</span>
            </div>
            <div class="detail-body">
              <div class="detail-day-num" id="detail-day-num">23</div>
              <div class="detail-date-full" id="detail-date-full">2026年 3月 23日 星期一</div>
              <div class="detail-pills">
                <div class="pill-item">
                  <i class="ph ph-briefcase"></i>
                  <span id="detail-w-index">本月第 15 个工作日</span>
                </div>
                <div class="pill-item">
                  <i class="ph ph-hourglass-high"></i>
                  <span id="detail-year-day">当年第 82 天</span>
                </div>
              </div>
              <div class="detail-holiday-info" id="detail-holiday-info">
                <!-- Holiday status or countdown to next holiday -->
              </div>
            </div>
          </div>

          <!-- Progress Bento Card -->
          <div class="bento-card progress-card">
            <div class="card-title">
              <i class="ph-fill ph-chart-line-up"></i>
              <span>工作进度</span>
            </div>

            <!-- Month Progress -->
            <div class="prog-group">
              <div class="prog-meta">
                <span class="prog-label">当月进度</span>
                <span class="prog-val" id="m-prog-txt">0%</span>
              </div>
              <div class="prog-track">
                <div class="prog-fill" id="m-prog-bar" style="width: 0%"></div>
              </div>
              <div class="prog-sub" id="m-summary">已工作 0 天，剩余 0 天</div>
            </div>

            <!-- Year Progress -->
            <div class="prog-group">
              <div class="prog-meta">
                <span class="prog-label">年度完成</span>
                <span class="prog-val accent-success" id="y-prog-txt">0%</span>
              </div>
              <div class="prog-track">
                <div class="prog-fill fill-success" id="y-prog-bar" style="width: 0%"></div>
              </div>
              <div class="prog-sub" id="y-summary">2026年已过去 0 天</div>
            </div>

            <!-- Counters -->
            <div class="counter-row">
              <div class="counter-box">
                <span class="counter-num" id="h-pass">0</span>
                <span class="counter-lbl">已休法定假</span>
              </div>
              <div class="counter-box highlight">
                <span class="counter-num accent-success" id="h-rem">0</span>
                <span class="counter-lbl">剩余法定假</span>
              </div>
            </div>
          </div>

          <!-- Upcoming Holidays Bento Card -->
          <div class="bento-card holidays-card">
            <div class="card-title">
              <i class="ph-fill ph-sparkle"></i>
              <span>假期倒计时</span>
            </div>
            <div class="holiday-list" id="holiday-list">
              <!-- Dynamically populated holiday countdown cards -->
            </div>
          </div>

        </aside>
      </main>

      <!-- Year Overview View Container (Hidden when not in 'year' view) -->
      <section class="year-view-container" id="year-view-container" style="display: none;">
        <div class="year-header">
          <div class="year-title">2026 年法定节假日与工作日图谱</div>
          <div class="year-legend">
            <span class="legend-item"><span class="dot dot-work"></span>工作日</span>
            <span class="legend-item"><span class="dot dot-rest"></span>周末</span>
            <span class="legend-item"><span class="dot dot-holiday"></span>法定节假日</span>
            <span class="legend-item"><span class="dot dot-makeup"></span>调休上班</span>
          </div>
        </div>
        <div class="year-grid" id="year-grid">
          <!-- JS will populate 12 mini month calendars -->
        </div>
      </section>

    </div>

    <script src="workday.js?v=3"></script>
    <script src="app.js?v=3"></script>
  </body>
</html>
